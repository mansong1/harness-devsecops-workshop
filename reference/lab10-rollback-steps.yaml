# Original workshop Labs 9 and 10 (no DB rollback group).
rollbackSteps:
- step:
    name: Canary Delete
    identifier: rollbackCanaryDelete
    type: K8sCanaryDelete
    timeout: 10m
    spec: {}
- step:
    name: Rolling Rollback
    identifier: rollingRollback
    type: K8sRollingRollback
    timeout: 10m
    spec: {}
- stepGroup:
    name: Failure Analysis
    identifier: Failure_Analysis
    template:
      templateRef: Failure_Analysis
      versionLabel: v0.1
- step:
    name: Record Failure Analysis
    identifier: Record_Failure_Analysis
    when:
      stageStatus: All
    failureStrategies:
    - onFailure:
        errors:
        - AllErrors
        action:
          type: Ignore
    template:
      templateRef: SNOW_Failure_Analysis
      versionLabel: v0.1
- step:
    name: Close Failed Ticket
    identifier: Close_Failed_Ticket
    when:
      stageStatus: All
    template:
      templateRef: SNOW_Close_Failed
      versionLabel: v0.1
